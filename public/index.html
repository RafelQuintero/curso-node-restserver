<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Google Sign-in</title>
	</head>
	<body>
		<h1>Google Sign-in</h1>
		<hr />

		<div
			id="g_id_onload"
			data-client_id="1086467512169-lqmb5fqr9nh4elgpfrvulj9rp8d1b7nr.apps.googleusercontent.com"
			data-auto_prompt="false"
			data-callback="handleCredentialResponse"
		></div>
		<div
			class="g_id_signin"
			data-type="standard"
			data-size="large"
			data-theme="outline"
			data-text="sign_in_with"
			data-shape="rectangular"
			data-logo_alignment="left"
		></div>
		<button id="goolge-signout">Signout</button>

		<script src="https://accounts.google.com/gsi/client" async defer></script>

		<script>
			function handleCredentialResponse(response) {
				//* ESTE ES EL Google Token : o  Tambien conocido con ID_TOKEN
				//console.log('id_token', response.credential);

				const body = { id_token: response.credential };

				fetch('http://localhost:8080/api/auth/google', {
					method: 'POST',
					headers: {
						'Content-type': 'application/json',
					},

					body: JSON.stringify(body),
				})
					.then((resp) => resp.json())
					.then((resp) => {
						console.log(resp);
						localStorage.setItem('email', resp.usuario.correo);
					})
					.catch(console.warn);
			}

			const button = document.getElementById('goolge-signout');
			button.onclick = () => {
				console.log(google.accounts.id);
				google.accounts.id.disableAutoSelect();
				google.accounts.id.revoke(localStorage.getItem('email'), (done) => {
					localStorage.clear();
					location.reload();
				});
			};
		</script>
	</body>
</html>
